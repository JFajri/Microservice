services:
  # =========================
  # EUREKA SERVER
  # =========================
  eureka-server:
    build: ./eureka
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservice-net
    # 💡 Ditambahkan healthcheck yang valid menggunakan wget dan actuator
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================
  # RABBITMQ
  # =========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - microservice-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================
  # AUTH SERVICE
  # =========================
  auth-service:
    build: ./auth
    container_name: auth-service
    ports:
      - "8090:8090"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservice-net

  # =========================
  # API GATEWAY
  # =========================
  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "9000:9000"
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - microservice-net

  # =========================
  # PRODUK
  # =========================
  produk-service:
    build: ./produk
    container_name: produk-service
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservice-net

  # =========================
  # PELANGGAN
  # =========================
  pelanggan-service:
    build: ./pelanggan
    container_name: pelanggan-service
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservice-net

  # =========================
  # ORDER
  # =========================
  order-service:
    build: ./order
    container_name: order-service
    ports:
      - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_healthy
      produk-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - microservice-net

  # =========================
  # PRODUCER
  # =========================
  produser-service:
    build: ./produser
    container_name: produser-service
    ports:
      - "8084:8084"
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservice-net

  # =========================
  # CONSUMER
  # =========================
  consumer-service:
    build: ./consumer
    container_name: consumer-service
    ports:
      - "8085:8085"
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservice-net

  # =========================
  # CADVISOR
  # =========================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    privileged: true
    restart: unless-stopped
    networks:
      - microservice-net

  # =========================
  # PROMETHEUS
  # =========================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - cadvisor
    restart: unless-stopped
    networks:
      - microservice-net

  # =========================
  # GRAFANA
  # =========================
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - microservice-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - microservice-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: logstash
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
    depends_on:
      - elasticsearch
    networks:
      - microservice-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - microservice-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: filebeat
    command: filebeat -e -strict.perms=false  # SOLUSI: Tambahkan perintah di bawah ini untuk mematikan validasi chmod
    user: root
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - microservice-net
volumes:
  esdata:
networks:
  microservice-net:
    driver: bridge