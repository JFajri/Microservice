server:
  port: 9000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Route untuk PRODUK
        - id: PRODUK
          uri: lb://PRODUK
          predicates:
            - Path=/api/produk/**

        # Route untuk PELANGGAN
        - id: PRODUK
          uri: lb://PELANGGAN
          predicates:
            - Path=/api/pelanggan/**

        # Route untuk AUTH
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**

        # Route untuk ORDER (Sudah diperbaiki namanya sesuai Eureka)
        - id: order-route
          uri: lb://ORDER
          predicates:
            - Path=/api/order/**
          filters:
            - name: AuthenticationFilterFactory  # Panggil ID yang kita buat di Java tadi
